# Applied once by hand. Argo CD does not recurse into subdirectories
# by default, so this file is not deployed as part of the app itself.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/csutaria/turingpi-redis-deployment.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-server
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
